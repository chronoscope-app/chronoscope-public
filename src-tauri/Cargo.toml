[package]
name = "chronoscope-desktop"
version = "0.15.2"
edition = "2021"
rust-version = "1.96"
license = "MIT"
[features]
default = ["custom-protocol"]
apple-intents-qa = ["chronoscope-apple-intents/qa"]
custom-protocol = ["tauri/custom-protocol"]
experimental-browser-webmcp = ["chronoscope/experimental-browser-webmcp"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
chronoscope = { path = ".." }
chronoscope-window-capture = { path = "window-capture" }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
chronoscope-dock-icon = { path = "dock-icon" }
chronoscope-apple-intents = { path = "apple-intents" }

[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "2", features = ["image-png"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSAppearance"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSString", "NSDistributedNotificationCenter"] }

[[example]]
name = "apple_intents_qa"
required-features = ["apple-intents-qa"]
