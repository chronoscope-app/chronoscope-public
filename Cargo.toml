[package]
name = "chronoscope"
version = "0.16.7"
edition = "2021"
rust-version = "1.96"
description = "Rust space-time engine, CLI and MCP server"
license = "MIT"

[workspace]
members = ["src-tauri"]
default-members = ["."]
exclude = ["vendor/glib", "tests/glib-backport"]
resolver = "2"

[features]
default = []
# Retained research bridge; excluded from ordinary CLI/desktop builds.
experimental-browser-webmcp = []
legacy = ["dep:eframe", "dep:egui_extras", "dep:rfd"]

[[bin]]
name = "chronoscope"
path = "src/main.rs"

[[bin]]
name = "chronoscope-legacy"
path = "src/legacy.rs"
required-features = ["legacy"]

[dependencies]
shapefile = { version = "=0.9.0", default-features = false, features = ["geo-types", "encoding_rs"] }
geozero = { version = "=0.15.1", default-features = false, features = ["with-wkb", "with-geo"] }
eframe = { version = "0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = { version = "0.31.1", optional = true }
rfd = { version = "0.15", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
calamine = { version = "0.37.0", features = ["dates"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive"] }
roxmltree = "0.20"
futures-util = "0.3"
sse-stream = "0.2.4"
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest"] }
mcp-http = { package = "reqwest", version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots", "json"] }
sha2 = "0.10"
base64 = "0.22"
directories = "6"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "process", "io-util"] }
rusqlite = { version = "0.37", features = ["bundled", "backup", "hooks", "functions", "limits"] }
jsonschema = { version = "0.37", default-features = false }
getrandom = "0.3"
geographiclib-rs = { version = "0.2", default-features = false }
mgrs-convert = "=0.1.0"
wkt = "0.14.0"
geo = { version = "0.31.0", default-features = false }
schemars = { version = "1", features = ["derive"] }
regex = "1"
average = { version = "=0.17.0", default-features = false, features = ["std"] }
accurate = { version = "=0.4.1", default-features = false }
statrs = { version = "=0.19.1", default-features = false, features = ["std"] }
linfa = { version = "=0.8.1", default-features = false }
linfa-clustering = { version = "=0.8.1", default-features = false }
linfa-linear = { version = "=0.8.1", default-features = false }
linfa-reduction = { version = "=0.8.1", default-features = false }
ndarray = "=0.16.1"
rand = "=0.8.6"
rand_xoshiro = "=0.6.0"
rustfft = "=6.4.1"
petgraph = { version = "=0.8.3", default-features = false, features = ["std"] }
strsim = "=0.11.1"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Compatible security backport; provenance and removal gate: vendor/glib/BACKPORT.md
[patch.crates-io]
glib = { path = "vendor/glib" }
