name: Checked tester desktop builds
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build one platform at a time within the shared free storage allowance
        required: true
        type: choice
        options: [windows-x86_64, macos-arm64]
      verify_only:
        description: Run all source checks and retain verified frontend without building a GUI package
        type: boolean
        default: false
      verification_run_id:
        description: Optional completed verification run for this exact SHA and platform
        type: string
        default: ""
      expected_sha:
        description: Exact reviewed main commit (40 hex characters)
        required: true
        type: string
concurrency:
  group: chronoscope-tester-build
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: github.repository == 'chronoscope-app/chronoscope-public' && github.ref == 'refs/heads/main'
    timeout-minutes: 90
    runs-on: ${{ inputs.platform == 'windows-x86_64' && 'windows-2025' || inputs.platform == 'macos-arm64' && 'macos-26' || 'ubuntu-24.04' }}
    env:
      CARGO_INCREMENTAL: '0'
      APPIMAGE_EXTRACT_AND_RUN: '1'
      PLATFORM: ${{ inputs.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Refuse unreviewed revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA" && test "${#EXPECTED_SHA}" = 40
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set temporary build directories
        run: |
          printf '%s\n' "CHRONOSCOPE_VERIFICATION_DIR=$RUNNER_TEMP/source-verification" "npm_config_cache=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"
      - name: Windows native and installer prerequisites before compilation
        id: windows-prerequisites
        if: runner.os == 'Windows'
        run: |
          python scripts/windows_release.py preflight --native --cache "$RUNNER_TEMP/windows-input-cache" --output "$RUNNER_TEMP/windows-preflight.json"
          python -c 'import hashlib,json,os,pathlib; r=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"],"windows-preflight.json").read_text()); p=pathlib.Path(os.environ["GITHUB_OUTPUT"]); p.open("a").write("native-identity="+hashlib.sha256(json.dumps(r["native_identity"],sort_keys=True).encode()).hexdigest()[:16]+"\n")'
      # Each optional dependency payload is bounded to 2 GiB. No app packages,
      # credentials or incremental compiler state are cached. Platform/SDK/flags
      # are part of the immutable cache namespace.
      - name: Restore bounded dependencies
        id: dependency-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/dependency-cache
          key: deps-v1-${{ inputs.platform }}-rust198-sdk${{ steps.windows-prerequisites.outputs.native-identity || '266' }}-portable-${{ hashFiles('Cargo.lock', 'frontend/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            deps-v1-${{ inputs.platform }}-rust198-sdk${{ steps.windows-prerequisites.outputs.native-identity || '266' }}-portable-${{ hashFiles('Cargo.lock', 'frontend/package-lock.json') }}
      - name: Restore dependency files
        continue-on-error: true
        run: python scripts/ci_cache.py restore --directory "$RUNNER_TEMP/dependency-cache"
      - name: Linux runner build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb libfuse2
      - name: Record compiler and hosted image
        run: |
          rustc -Vv
          node --version
          python --version
          echo "$ImageOS $ImageVersion $RUNNER_ARCH"
      - name: Select installed macOS SDK
        if: runner.os == 'macOS'
        run: |
          test -d /Applications/Xcode_26.6.app
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: macOS SDK evidence
        if: runner.os == 'macOS'
        run: |
          set -x
          xcodebuild -version
          xcrun swiftc --version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx --show-sdk-path
          SDK="$(cd "$(xcrun --sdk macosx --show-sdk-path)" && pwd -P)"
          printf 'Canonical macOS SDK: %s\n' "$SDK"
          find "$SDK" \( -name '*AppIntents*.tbd' -o -name '*FoundationModels*.tbd' \) -print
          xcrun --find appintentsmetadataprocessor
          test "$(uname -m)" = arm64
          test "$(xcrun --sdk macosx --show-sdk-version)" = 26.5
          test -e "$SDK/System/Library/Frameworks/FoundationModels.framework/FoundationModels.tbd"
          test -e "$SDK/System/Library/Frameworks/AppIntents.framework/AppIntents.tbd"
          find "$SDK" -name '_AppIntents_AppKit.tbd' -print | grep .
          xcrun --find appintentsmetadataprocessor
      - name: Compile App Intents metadata before Rust checks
        if: runner.os == 'macOS'
        working-directory: src-tauri/apple-intents
        env:
          CARGO_CFG_TARGET_OS: macos
          CARGO_CFG_TARGET_ARCH: aarch64
          OUT_DIR: ${{ runner.temp }}/chronoscope-app-intents-probe
        run: |
          mkdir -p "$OUT_DIR"
          rustc --edition=2021 build.rs -o "$RUNNER_TEMP/chronoscope-intents-probe"
          "$RUNNER_TEMP/chronoscope-intents-probe"
          test -s "$OUT_DIR/libChronoscopeIntents.a"
          test -s "$OUT_DIR/Intents.swiftconstvalues"
          test -d "$OUT_DIR/metadata/Metadata.appintents"
          find "$OUT_DIR/metadata/Metadata.appintents" -type f -size +0c -print | grep .
      - name: Set consistent portable compiler flags
        run: python scripts/build_portable.py --github-env
      - run: npm --prefix frontend ci
      # The offline GLib guard inspects Linux GTK even on Windows/macOS.
      # No --target: fetch the locked workspace for every platform, without
      # compiling or requiring a foreign Rust standard library/toolchain.
      - name: Prefetch locked Cargo dependencies
        run: cargo fetch --locked --manifest-path Cargo.toml
      - name: Reuse verified source and frontend
        if: inputs.verification_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
        run: python scripts/ci_verification.py reuse --run-id "$VERIFICATION_RUN_ID"
      - name: Shared source verification
        if: inputs.verification_run_id == ''
        run: python -B scripts/source_checks.py --packaging --report "$RUNNER_TEMP/source-validation/report.json"
      - name: Build frontend once
        if: inputs.verification_run_id == ''
        run: npm run build
      - name: Inventory executable and non-executable Windows web assets
        if: runner.os == 'Windows'
        run: python scripts/windows_release.py frontend --output "$RUNNER_TEMP/windows-frontend-inventory.json"
      - name: Native desktop lint
        if: inputs.verification_run_id == ''
        run: cargo clippy --locked -p chronoscope-desktop -- -D warnings
      - run: python scripts/build_portable.py build --locked --release --timings -p chronoscope --bin chronoscope
      - name: Verify generated contracts from the release CLI
        run: |
          CLI=target/release/chronoscope
          if [ "$RUNNER_OS" = Windows ]; then CLI="$CLI.exe"; fi
          python -B scripts/source_checks.py --contracts-only --cli "$CLI" --report "$RUNNER_TEMP/contracts-validation/report.json"
      - name: Seal source verification
        if: inputs.verification_run_id == ''
        run: python scripts/ci_verification.py seal --source-report "$RUNNER_TEMP/source-validation/report.json" --contracts-report "$RUNNER_TEMP/contracts-validation/report.json"
      - name: Upload source verification
        if: inputs.verification_run_id == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-verification-${{ inputs.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/source-verification/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          include-hidden-files: true
      - name: Build actual GUI distribution
        if: ${{ !inputs.verify_only }}
        run: >-
          python scripts/build_portable.py -- npm --prefix frontend run tauri -- build
          --config '{"build":{"beforeBuildCommand":"python scripts/ci_verification.py verify-frontend"}}'
          -- --locked
      - name: Finish Linux portable WebKit runtime
        if: runner.os == 'Linux' && !inputs.verify_only
        run: python scripts/package_linux.py
      - name: Browser workflow smoke on hosted Linux
        if: runner.os == 'Linux' && !inputs.verify_only
        timeout-minutes: 10
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npm run test:ui
          npm run test:assistant
          npm run test:wkt-wmts
      - name: Validate and stage actual GUI package
        if: ${{ !inputs.verify_only }}
        env:
          PLATFORM: ${{ inputs.platform }}
        run: python scripts/package_tester.py --target "$PLATFORM" --output "$RUNNER_TEMP/tester-output" --max-bytes 268435456
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !inputs.verify_only }}
        with:
          name: ${{ inputs.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/tester-output/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Prepare bounded dependency cache
        id: prepared-cache
        if: always() && !cancelled() && steps.dependency-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python scripts/ci_cache.py prepare --directory "$RUNNER_TEMP/dependency-cache"
      - name: Save bounded dependencies
        if: always() && !cancelled() && steps.prepared-cache.outcome == 'success' && steps.dependency-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/dependency-cache
          key: deps-v1-${{ inputs.platform }}-rust198-sdk${{ steps.windows-prerequisites.outputs.native-identity || '266' }}-portable-${{ hashFiles('Cargo.lock', 'frontend/package-lock.json') }}-${{ github.run_id }}
      - name: Retain source validation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-validation-${{ inputs.platform }}-${{ github.sha }}
          path: |
            target/cargo-timings/*.html
            ${{ runner.temp }}/source-validation/report.json
            ${{ runner.temp }}/source-validation/runs/*/run.json
            ${{ runner.temp }}/source-validation/runs/*/logs/*.log
            ${{ runner.temp }}/contracts-validation/report.json
            ${{ runner.temp }}/contracts-validation/runs/*/run.json
            ${{ runner.temp }}/contracts-validation/runs/*/logs/*.log
            ${{ runner.temp }}/windows-preflight.json
            ${{ runner.temp }}/windows-frontend-inventory.json
          if-no-files-found: warn
          retention-days: 1
