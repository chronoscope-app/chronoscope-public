name: Bug report
description: Report a reproducible problem using synthetic or safely redacted data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities or suspected disclosure, follow [SECURITY.md](https://github.com/chronoscope-app/chronoscope-public/blob/main/SECURITY.md).
        Do not post real location histories, private chats, API keys, certificates or unreviewed logs. Prefer a tiny synthetic example.
  - type: input
    id: version
    attributes:
      label: Version and download or source
      description: Give the app version and release link, or exact source commit for a local build.
      placeholder: "0.15.1 macOS arm64 preview, or source commit"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and hardware
      description: Include OS version and architecture; include GPU only if relevant.
      placeholder: "macOS version / Apple Silicon; Windows version / x64; or Linux distribution"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give numbered steps and a small synthetic fixture if needed. Review attachments before uploading.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include exact safe error text. Redact account names, paths, service addresses and record values as needed.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I reviewed the report and attachments for credentials, private records and identifying information.
          required: true
